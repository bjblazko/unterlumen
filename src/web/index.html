<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unterlumen</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/fonts/fonts.css?v=1">
    <script src="/js/theme-init.js"></script>
    <link rel="stylesheet" href="/css/style.css?v=19">
    <link href="/css/vendor/maplibre-gl.css?v=1" rel="stylesheet" />
    <script src="/js/vendor/maplibre-gl.js?v=1"></script>
</head>
<body>
    <div class="shell">
        <nav class="sidebar" id="sidebar" aria-label="Main">
            <div class="brand">
                <span class="brand-left" id="about-trigger" role="button" tabindex="0" title="About Unterlumen">
                    <svg class="brand-logo" viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <rect x="0" y="0" width="25" height="4" fill="currentColor"/>
                        <rect x="26" y="0" width="10" height="4" fill="currentColor" fill-opacity="0.3"/>
                        <polygon points="0,8 36,8 18,28" fill="var(--accent)"/>
                    </svg>
                    <span class="brand-name">Unterlumen</span>
                </span>
                <button class="collapse-btn" id="sidebar-collapse" aria-expanded="true" aria-controls="sidebar" aria-label="Collapse sidebar" title="Collapse sidebar (\)">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <rect x="1.5" y="2.5" width="13" height="11"/><path d="M5.5 2.5v11"/>
                        <path class="collapse-chevron" d="M11 6l-2 2 2 2"/>
                    </svg>
                </button>
            </div>

            <div class="nav-group">
                <div class="nav-label">Cull</div>
                <a class="nav-item" id="mode-browse" href="#folders" data-mode="browse">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1.5 4.5v8h13v-7H7.5L6 4H1.5z"/>
                    </svg>
                    <span class="nav-text">Folders</span>
                </a>
                <a class="nav-item" id="mode-wastebin" href="#marked" data-mode="wastebin">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                        <path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/>
                    </svg>
                    <span class="nav-text">Marked for deletion</span>
                    <span class="nav-count" id="wastebin-count"></span>
                </a>
                <a class="nav-item" id="mode-commander" href="#organize" data-mode="commander">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <rect x="1.5" y="2.5" width="5.5" height="11"/><rect x="9" y="2.5" width="5.5" height="11"/>
                    </svg>
                    <span class="nav-text">Organize</span>
                </a>
            </div>

            <div class="nav-group" id="nav-catalog">
                <div class="nav-label">Catalog</div>
                <a class="nav-item" id="mode-library" href="#libraries" data-mode="library">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <rect x="1.5" y="2.5" width="13" height="11"/><path d="M1.5 6h13M5.5 6v7.5"/>
                    </svg>
                    <span class="nav-text">Libraries</span>
                </a>
                <div id="nav-libraries"></div>
            </div>

            <div class="nav-group">
                <div class="nav-label">Publish</div>
                <a class="nav-item" id="mode-published" href="#galleries" data-mode="published">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                        <rect x="1.5" y="2.5" width="13" height="11"/><path d="M1.5 11l4-4 3 3 2-2 4 4"/>
                    </svg>
                    <span class="nav-text">Galleries</span>
                </a>
                <a class="nav-item" id="mode-destinations" href="#destinations" data-mode="destinations">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2 11 0 13M8 1.5c-2 2-2 11 0 13"/>
                    </svg>
                    <span class="nav-text">Destinations</span>
                </a>
            </div>

            <div class="nav-foot">
                <div class="dropdown-wrap">
                    <button class="btn btn-sm dropdown-btn nav-settings-btn" id="settings-btn" title="Settings">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                            <circle cx="8" cy="8" r="2.5"/>
                            <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"/>
                        </svg>
                        <span class="nav-text">Settings</span>
                        <svg class="dropdown-chevron" width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3l2 2 2-2"/></svg>
                    </button>
                    <div class="dropdown-menu dropdown-menu-up" id="settings-menu" style="display:none">
                    <div class="dropdown-section">
                        <label class="dropdown-label">Theme</label>
                        <div class="dropdown-toggle">
                            <button class="btn btn-sm" data-theme-set="light">Light</button>
                            <button class="btn btn-sm" data-theme-set="auto">Auto</button>
                            <button class="btn btn-sm" data-theme-set="dark">Dark</button>
                        </div>
                    </div>
                    <div class="dropdown-section">
                        <label class="dropdown-label">Thumbnail quality</label>
                        <div id="settings-thumb-quality-wrap"></div>
                    </div>
                    <div class="dropdown-section">
                        <label class="dropdown-label">Show interface</label>
                        <div id="settings-hide-ui-wrap"></div>
                    </div>
                    <div class="dropdown-section">
                        <label class="dropdown-label">Cache</label>
                        <div class="cache-size-col">
                            <span id="settings-cache-size">–</span>
                            <span class="cache-info-path" id="settings-cache-path"></span>
                        </div>
                    </div>
                    <div class="dropdown-section cache-clear-section" style="padding:0">
                        <button class="btn dropdown-item" id="settings-clear-cache">Clear cache</button>
                    </div>
                    <div class="dropdown-section" style="padding:0">
                        <button class="btn dropdown-item" id="settings-check-deps">Check dependencies</button>
                    </div>
                    </div>
                </div>
            </div>
        </nav>
        <main id="app"></main>
    </div>

    <div id="ui-hint" class="ui-hint"></div>

    <script src="/js/channels.js?v=11"></script>
    <script src="/js/destinations.js?v=1"></script>
    <script src="/js/published-galleries.js?v=6"></script>
    <script src="/js/collect-dialog.js?v=1"></script>
    <script src="/js/publish-dialog.js?v=2"></script>
    <script src="/js/library-pane.js?v=4"></script>
    <script src="/js/search-result-pane.js?v=4"></script>
    <script src="/js/chip-input.js?v=7"></script>

    <script src="/js/vendor/d3.v7.min.js?v=4"></script>
    <script src="/js/stats-modal.js?v=4"></script>
    <script src="/js/library.js?v=8"></script>
    <script src="/js/app-theme.js?v=4"></script>

    <script src="/js/app-keyboard.js?v=4"></script>
    <script src="/js/app.js?v=6"></script>
</body>
