version: 2

project_name: unterlumen

before:
  hooks:
    - sh -c "cd src && go mod tidy"

builds:
  - dir: src
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ if eq .Os "darwin" }}{{ if eq .Arch "amd64" }}intel{{ else }}apple_silicon{{ end }}{{ else }}{{ .Arch }}{{ end }}'
    # The third-party license texts are inside the binary too (About >
    # Licenses and thanks); they lie beside it so they can be read unopened.
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: src/web/licenses/*.txt
        dst: licenses
        strip_parent: true

checksum:
  name_template: checksums.txt

# The one-line installers (ADR-0042). Attached to every release, so
# releases/latest/download/install.sh is always the newest one.
release:
  extra_files:
    - glob: ./install/install.sh
    - glob: ./install/install.ps1

changelog:
  sort: asc
  filters:
    exclude:
      - '^doc:'
      - '^chore:'
